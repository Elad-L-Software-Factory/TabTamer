title = "TabTamer secret and personal-data scan"

# Start from gitleaks' built-in rules (API keys, tokens, private keys...)
[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_\-]{20,}'''
tags = ["key", "anthropic"]

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[A-Za-z0-9_\-]{10,}'''
tags = ["key", "google"]

[[rules]]
id = "google-oauth-client-id"
description = "Real Google OAuth client ID (keep out of the repo)"
regex = '''[0-9]{8,}-[a-z0-9]{20,}\.apps\.googleusercontent\.com'''
tags = ["google"]

[[rules]]
id = "personal-email-address"
description = "Email address (personal data must never be committed)"
regex = '''[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'''
tags = ["pii", "email"]
  [rules.allowlist]
  regexes = [
    '''@users\.noreply\.github\.com''',
    '''@example\.(com|org|net)''',
    '''noreply@anthropic\.com''',
    '''@anthropic-ai/''',
  ]

[allowlist]
description = "Template and lock files"
paths = [
  '''\.env\.example$''',
  '''pnpm-lock\.yaml$''',
]
